<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<style>
body{
background-color: black;
color: white;
}
</style>
<body>

<div class="container mt-4">
<h4 class="mb-3">Welcome {{ session.get('name') }}</h4>
<h2 class="text-center mb-4">Available Cars</h2>
<a href="/recommend" class="btn btn-warning">AI Recommendation 🚀</a>
<!-- Search Box -->

<form method="GET" action="/dashboard" class="mb-4">
<div class="row">

<div class="col-md-10">
<input type="text" name="search" class="form-control" placeholder="Search cars...">
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100">Search</button> 
<input type="text" name="search" class="form-control"
       placeholder="Search cars..."
       value="{{ request.args.get('search','') }}">
</div>

</div>
</form>


<div class="row">

{% for v in vehicles %}

<div class="col-md-4">

<div class="card mb-4 shadow">

<img src="{{ url_for('static', filename='images/' + v.image) if v.image else url_for('static', filename='images/default.jpg') }}" class="card-img-top" height="200">

<div class="card-body">

<h5 class="card-title">{{v.name}}</h5>

<p class="card-text">
Brand: {{v.brand}} <br>
Price: ₹{{v.rent_per_day}} / day
</p>

<a href="/book/{{v.vehicle_id}}" class="btn btn-success">Book Now</a>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
